  - module: generic_config_updater.test_lo_interface
    skip:
      - test_lo_interface_tc1_suite
  - generic_config_updater.test_mgmt_interface
  - generic_config_updater.test_mmu_dynamic_threshold_config_update
  - generic_config_updater.test_monitor_config
  - generic_config_updater.test_ntp
  - generic_config_updater.test_pfcwd_interval
